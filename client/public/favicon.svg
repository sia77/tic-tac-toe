<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="2" fill="#ffffff"/>

  <!-- Grid -->
  <g fill="#c8d1ff">
    <rect x="1" y="1" width="9" height="9" rx="1"/>
    <rect x="11.5" y="1" width="9" height="9" rx="1"/>
    <rect x="22" y="1" width="9" height="9" rx="1"/>

    <rect x="1" y="11.5" width="9" height="9" rx="1"/>
    <rect x="11.5" y="11.5" width="9" height="9" rx="1"/>
    <rect x="22" y="11.5" width="9" height="9" rx="1"/>

    <rect x="1" y="22" width="9" height="9" rx="1"/>
    <rect x="11.5" y="22" width="9" height="9" rx="1"/>
    <rect x="22" y="22" width="9" height="9" rx="1"/>
  </g>

  <!-- O -->
  <circle
    cx="5.5"
    cy="5.5"
    r="3"
    fill="none"
    stroke="#2f7df6"
    stroke-width="1.5"
  />

  <!-- X -->
  <g
    stroke="#ff3b3b"
    stroke-width="1.5"
    stroke-linecap="round"
  >
    <line x1="14" y1="14" x2="19" y2="19"/>
    <line x1="19" y1="14" x2="14" y2="19"/>
  </g>
</svg>